# R-hub's generic GitHub Actions workflow file. Its canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.

name: R-hub
run-name: >-
  ${{ github.event.inputs.name }}
  | ${{ github.event.inputs.config }}
  | ${{ format('Triggered by @{0}', github.triggering_actor) }}

on:
  workflow_dispatch:
    inputs:
      config:
        description: >-
          Comma-separated list of R-hub platforms to use.
          Full list: summary(rhub::rhub_platforms())
        type: string
        default: 'linux,windows,macos'
      name:
        description: 'Run name (optional)'
        type: string

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      with:
        config: ${{ github.event.inputs.config }}
      id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

      - name: Detect OS distribution
        id: os-check
        run: |
          if [ -f /etc/os-release ]; then
            . /etc/os-release
            case "$ID" in
              fedora|rhel|centos|rocky|almalinux)
                echo "is_fedora=true" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "is_fedora=false" >> $GITHUB_OUTPUT
                ;;
            esac
          else
            echo "is_fedora=false" >> $GITHUB_OUTPUT
          fi

      - if: ${{ steps.os-check.outputs.is_fedora != 'true' }}
        uses: dcarbone/install-jq-action@v4.0.1
      - if: ${{ steps.os-check.outputs.is_fedora != 'true' }}
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Quarto CLI via Tarball (Fedora)
        if: ${{ steps.os-check.outputs.is_fedora == 'true' }}
        run: |
          # Fetch glibc dependencies needed by Quarto dynamic binary
          dnf install -y wget glibc glibc-common libstdc++ tar || yum install -y wget glibc libstdc++ tar

          QUARTO_URL=$(curl -s https://api.github.com/repos/quarto-dev/quarto-cli/releases/latest | jq -r '.assets[] | select(.name | endswith("linux-amd64.tar.gz")) | .browser_download_url')

          if [ -z "$QUARTO_URL" ] || [ "$QUARTO_URL" = "null" ]; then
            QUARTO_URL="https://github.com/quarto-dev/quarto-cli/releases/download/v1.5.57/quarto-1.5.57-linux-amd64.tar.gz"
          fi

          mkdir -p /opt/quarto
          curl -sL "$QUARTO_URL" | tar -xz -C /opt/quarto --strip-components=1

          ln -sf /opt/quarto/bin/quarto /usr/local/bin/quarto

      - name: Configure Quarto environment
        run: |
          QUARTO_BIN=$(command -v quarto || echo "/opt/quarto/bin/quarto")
          QUARTO_DIR=$(dirname "$QUARTO_BIN")
          echo "QUARTO_PATH=$QUARTO_BIN" >> $GITHUB_ENV
          echo "QUARTO_BIN_PATH=$QUARTO_DIR" >> $GITHUB_ENV

      - name: Pre-install package for Quarto vignette subprocess
        run: R CMD INSTALL .
        shell: bash
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Pre-install package for Quarto vignette subprocess
        run: R CMD INSTALL .
        shell: bash
      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
