# R-hub's generic GitHub Actions workflow file. Its canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.

name: R-hub
run-name: >-
  ${{ github.event.inputs.name }}
  | ${{ github.event.inputs.config }}
  | ${{ format('Triggered by @{0}', github.triggering_actor) }}

on:
  workflow_dispatch:
    inputs:
      config:
        description: >-
          Comma-separated list of R-hub platforms to use.
          Full list: summary(rhub::rhub_platforms())
        type: string
        default: 'linux,windows,macos'
      name:
        description: 'Run name (optional)'
        type: string

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      with:
        config: ${{ github.event.inputs.config }}
      id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - name: Quarto installation - provide dummy `sudo`
        run: |
          if ! command -v sudo >/dev/null 2>&1; then
            echo '#!/bin/sh' > /usr/local/bin/sudo
            echo 'exec "$@"' >> /usr/local/bin/sudo
            chmod +x /usr/local/bin/sudo
          fi
      - name: Quarto installation - Install dependencies
        run: |
          if [ -f /etc/os-release ]; then
            . /etc/os-release
            case "$ID" in
              ubuntu|debian)
                apt-get update -qq && apt-get install -y -qq wget curl
                ;;
              fedora|rhel|centos|rocky|almalinux)
                dnf install -y wget curl tar || yum install -y wget curl tar

                cat << 'EOF' > /usr/local/bin/apt
          #!/bin/sh
          cmd="$1"
          shift
          case "$cmd" in
            update)
              exit 0
              ;;
            install)
              pkgs=""
              for arg in "$@"; do
                case "$arg" in
                  -*) ;;
                  *) pkgs="$pkgs $arg" ;;
                esac
              done
              if command -v dnf >/dev/null 2>&1; then
                exec dnf install -y $pkgs
              else
                exec yum install -y $pkgs
              fi
              ;;
            *)
              exit 0
              ;;
          esac
          EOF
                chmod +x /usr/local/bin/apt
                cp /usr/local/bin/apt /usr/local/bin/apt-get
                ;;
              alpine)
                apk add --no-cache wget curl tar
                ;;
            esac
          fi
      - uses: dcarbone/install-jq-action@v4.0.1
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Symlink Quarto to system PATH
        run: |
          QUARTO_BIN=$(which quarto || echo "/usr/local/bin/quarto")
          if [ -f "$QUARTO_BIN" ]; then
            ln -sf "$QUARTO_BIN" /usr/bin/quarto
          fi
          # Also set environment variable for R sub-processes
          echo "QUARTO_PATH=$QUARTO_BIN" >> $GITHUB_ENV
      - name: Pre-install package for Quarto vignette subprocess
        run: R CMD INSTALL .
        shell: bash
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Pre-install package for Quarto vignette subprocess
        run: R CMD INSTALL .
        shell: bash
      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
