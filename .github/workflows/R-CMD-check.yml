# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 4'  # Thursdays, 4am
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "Meta**"
      - "memcheck**"
      - "docs**"
      - "**.git"
      - "**.json"
      - "**.md"
      - "**.yaml"
      - "**.yml"
      - "!**R-CMD-check.yml"
      - "**.R[dD]ata"
      - "**.Rpro*"
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "Meta**"
      - "memcheck**"
      - "docs**"
      - "**.git"
      - "**.json"
      - "**.md"
      - "**.yaml"
      - "**.yml"
      - "!**R-CMD-check.yml"
      - "**.R[dD]ata"
      - "**.Rpro*"

name: R-CMD-check

# NB: there is deliberately NO workflow-level `concurrency`. Workflow-level
# cancel-in-progress would kill the whole run (sense-check included) on every
# new push. Instead, each EXPENSIVE job carries its own per-leg concurrency
# group so superseded Windows/macOS work is cancelled, while the cheap
# `sense-check` job has no concurrency and therefore always runs to completion
# -- giving a per-commit "did this build?" signal even under rapid iteration.

# Waves:
#   sense-check -> arm (cheapest), always runs, never cancelled. Fast signal.
#   core        -> Windows (+codecov) / R 4.1 / R devel; only if sense-check passed.
#   full        -> macOS x2 + ubuntu-24.04 (release) backstop; only once core is green.
#   revdepcheck -> reverse-dependency checks; also gated on core being green.
jobs:
  # ---------------------------------------------------------------------------
  # Wave 1: cheapest leg as a fail-fast sense-check. No concurrency group, so a
  # rapid follow-up push does NOT cancel it -- each commit gets its own signal.
  # ---------------------------------------------------------------------------
  sense-check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30  # healthy run is ~5 min
    name: sense-check (ubuntu-24.04-arm, release)

    env:
      _R_CHECK_CRAN_INCOMING_: ${{ github.event_name == 'pull_request' }}
      _R_CHECK_FORCE_SUGGESTS_: false # CRAN settings
      R_COMPILE_AND_INSTALL_PACKAGES: 'never'
      _R_CHECK_THINGS_IN_CHECK_DIR_: false
      R_REMOTES_STANDALONE: true
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      R_REALLY_FORCE_SYMBOLS: true # Until R4.3
      _R_CHECK_CRAN_INCOMING_USE_ASPELL_: false
      RSPM: "https://packagemanager.posit.co/cran/__linux__/noble/latest"
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v6

      - name: Temporarily bump package version
        run: |
          old_version=$(grep "Version:" DESCRIPTION | awk '{print $2}')
          if [[ $(echo "$old_version" | tr -cd '.' | wc -c) -eq 2 ]]; then
            new_version="${old_version}.9999"
            sed -i "s/Version: .*/Version: ${new_version}/" DESCRIPTION
          fi
        shell: bash

      # setup-r's first act on Linux is an internal `apt-get update`, and apt
      # applies no transfer timeout by default: when a mirror accepts the
      # connection and then stalls, the fetch never returns and the step burns
      # the job's entire 6-hour budget. Observed 2026-08-19, when
      # azure.archive.ubuntu.com went dark and the archive.ubuntu.com fallback
      # stalled part-way through the index fetch -- a step whose healthy cost is
      # ~35 s sat at 75 minutes. Capping the timeout turns that into a retry.
      - name: Make apt fail fast on a stalled mirror
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::ftp::Timeout "20";
          EOF

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 15
        with:
          r-version: release

      - name: Install apt packages
        run: |
          sudo apt-get install texlive-latex-base texlive-fonts-recommended

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: |
            check

      - name: Check package
        uses: r-lib/actions/check-r-package@v2

      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 170,
              body: 'Scheduled workflow has failed: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 170,
              state: 'open'
            });

  # ---------------------------------------------------------------------------
  # Wave 2: Windows (+codecov), R 4.1, R devel. Runs only if the sense-check
  # passed. Per-leg concurrency so a superseding push cancels in-flight legs.
  # ---------------------------------------------------------------------------
  core:
    needs: sense-check
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45  # healthy run is ~11 min
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    concurrency:
      group: ${{ github.workflow }}-core-${{ matrix.config.os }}-${{ matrix.config.r }}-${{ github.ref }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: "release"}
          - {os: ubuntu-24.04, r: "4.1", rspm: "https://packagemanager.posit.co/cran/2026-06-05"}
          - {os: ubuntu-24.04, r: "devel", rspm: "https://packagemanager.posit.co/cran/__linux__/noble/latest"}

    env:
      _R_CHECK_CRAN_INCOMING_: ${{ github.event_name == 'pull_request' }}
      _R_CHECK_FORCE_SUGGESTS_: false # CRAN settings
      R_COMPILE_AND_INSTALL_PACKAGES: 'never'
      _R_CHECK_THINGS_IN_CHECK_DIR_: false
      R_REMOTES_STANDALONE: true
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      R_REALLY_FORCE_SYMBOLS: true # Until R4.3
      _R_CHECK_CRAN_INCOMING_USE_ASPELL_: false # Set to true when can figure how to install aspell on Windows
      RSPM: ${{ matrix.config.rspm }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v6

      - name: Temporarily bump package version
        run: |
          old_version=$(grep "Version:" DESCRIPTION | awk '{print $2}')
          if [[ $(echo "$old_version" | tr -cd '.' | wc -c) -eq 2 ]]; then
            new_version="${old_version}.9999"
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              sed -i "" "s/Version: .*/Version: ${new_version}/" DESCRIPTION
            else
              sed -i "s/Version: .*/Version: ${new_version}/" DESCRIPTION
            fi
          fi
          echo "Current package version is now: $(grep "Version:" DESCRIPTION | awk '{print $2}')"
        shell: bash

      # setup-r's first act on Linux is an internal `apt-get update`, and apt
      # applies no transfer timeout by default: when a mirror accepts the
      # connection and then stalls, the fetch never returns and the step burns
      # the job's entire 6-hour budget. Observed 2026-08-19, when
      # azure.archive.ubuntu.com went dark and the archive.ubuntu.com fallback
      # stalled part-way through the index fetch -- a step whose healthy cost is
      # ~35 s sat at 75 minutes. Capping the timeout turns that into a retry.
      - name: Make apt fail fast on a stalled mirror
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::ftp::Timeout "20";
          EOF

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 15
        with:
          r-version: ${{ matrix.config.r }}

      - name: Install apt packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install texlive-latex-base texlive-fonts-recommended

      - name: Set up R dependencies (Windows)
        if: runner.os == 'Windows'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: |
            check
            coverage

      - name: Set up R dependencies (Non-Windows)
        if: ${{runner.os != 'Windows' && matrix.config.r >= '4.1' }}
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: |
            check
          # highs >= 1.13 calls base R's `%||%` (added in R 4.4.0) while still
          # declaring `R (>= 4.0.0)`, so it errors on our R 4.1 leg with
          # "could not find function '%||%'". Pin the last good version there
          # until upstream fixes its declared R dependency (already done on
          # their dev branch). Remove once a fixed highs reaches CRAN.
          extra-packages: ${{ matrix.config.r == '4.1' && 'url::https://cran.r-project.org/src/contrib/Archive/highs/highs_1.12.0-3.tar.gz' || '' }}

      - name: Pre-install package for Quarto vignette subprocess
        if: runner.os == 'Windows'
        run: R CMD INSTALL .
        shell: bash

      - name: Check package
        uses: r-lib/actions/check-r-package@v2

      - name: Code coverage
        if: runner.os == 'Windows'
        run: |
          covr::codecov()
        shell: Rscript {0}

      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 170,
              body: 'Scheduled workflow has failed: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 170,
              state: 'open'
            });

  # ---------------------------------------------------------------------------
  # Wave 3 (backstop): the expensive, mostly-duplicate-failure legs. Only runs
  # once the core wave is green, which in practice is "about to merge".
  # macOS is ~10x runner-minutes, so keeping it off every push is the big save.
  # ---------------------------------------------------------------------------
  full:
    needs: core
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60  # macOS legs are the slow ones
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    concurrency:
      group: ${{ github.workflow }}-full-${{ matrix.config.os }}-${{ matrix.config.r }}-${{ github.ref }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-24.04, r: "release", rspm: "https://packagemanager.posit.co/cran/__linux__/noble/latest"}
          - {os: macos-15-intel, r: "release"} # Until Intel architecture retired 2027-11
          - {os: macOS-latest, r: "release"}

    env:
      _R_CHECK_CRAN_INCOMING_: ${{ github.event_name == 'pull_request' }}
      _R_CHECK_FORCE_SUGGESTS_: false # CRAN settings
      R_COMPILE_AND_INSTALL_PACKAGES: 'never'
      _R_CHECK_THINGS_IN_CHECK_DIR_: false
      R_REMOTES_STANDALONE: true
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      R_REALLY_FORCE_SYMBOLS: true # Until R4.3
      _R_CHECK_CRAN_INCOMING_USE_ASPELL_: false
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v6

      - name: Temporarily bump package version
        run: |
          old_version=$(grep "Version:" DESCRIPTION | awk '{print $2}')
          if [[ $(echo "$old_version" | tr -cd '.' | wc -c) -eq 2 ]]; then
            new_version="${old_version}.9999"
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              sed -i "" "s/Version: .*/Version: ${new_version}/" DESCRIPTION
            else
              sed -i "s/Version: .*/Version: ${new_version}/" DESCRIPTION
            fi
          fi
          echo "Current package version is now: $(grep "Version:" DESCRIPTION | awk '{print $2}')"
        shell: bash

      # setup-r's first act on Linux is an internal `apt-get update`, and apt
      # applies no transfer timeout by default: when a mirror accepts the
      # connection and then stalls, the fetch never returns and the step burns
      # the job's entire 6-hour budget. Observed 2026-08-19, when
      # azure.archive.ubuntu.com went dark and the archive.ubuntu.com fallback
      # stalled part-way through the index fetch -- a step whose healthy cost is
      # ~35 s sat at 75 minutes. Capping the timeout turns that into a retry.
      - name: Make apt fail fast on a stalled mirror
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::ftp::Timeout "20";
          EOF

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 15
        with:
          r-version: ${{ matrix.config.r }}

      - name: Install apt packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install texlive-latex-base texlive-fonts-recommended

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: |
            check

      - name: Check package
        uses: r-lib/actions/check-r-package@v2

      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 170,
              body: 'Scheduled workflow has failed: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 170,
              state: 'open'
            });

  # ---------------------------------------------------------------------------
  # Reverse-dependency checks: also a wave-3 backstop, gated on core being green.
  # ---------------------------------------------------------------------------
  rev-dep-check:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 90  # revdepchecks are genuinely long

    name: revdepcheck (${{ matrix.config.deps }})

    concurrency:
      group: ${{ github.workflow }}-revdep-${{ matrix.config.deps }}-${{ github.ref }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        config:
          - {deps: '"Depends"'}
          - {deps: '"Suggests"'}
          - {deps: '"Imports"'}
          - {deps: '"LinkingTo"'}

    env:
      _R_CHECK_CRAN_INCOMING_: false
      _R_CHECK_FORCE_SUGGESTS_: false # CRAN settings
      R_COMPILE_AND_INSTALL_PACKAGES: 'never'
      _R_CHECK_THINGS_IN_CHECK_DIR_: false
      R_REMOTES_STANDALONE: true
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # setup-r's first act on Linux is an internal `apt-get update`, and apt
      # applies no transfer timeout by default: when a mirror accepts the
      # connection and then stalls, the fetch never returns and the step burns
      # the job's entire 6-hour budget. Observed 2026-08-19, when
      # azure.archive.ubuntu.com went dark and the archive.ubuntu.com fallback
      # stalled part-way through the index fetch -- a step whose healthy cost is
      # ~35 s sat at 75 minutes. Capping the timeout turns that into a retry.
      - name: Make apt fail fast on a stalled mirror
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::ftp::Timeout "20";
          EOF

      - uses: ms609/actions/revdepcheck@main
        with:
          deps: ${{ matrix.config.deps }}

      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 170,
              body: 'Scheduled workflow has failed: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 170,
              state: 'open'
            });
