url: https://ms609.github.io/MaxMin/

development:
  mode: auto

template:
  bootstrap: 5
  math-rendering: mathjax

authors:
  Martin R. Smith:
    href: https://smithlabdurham.github.io/

reference:
  - title: Greedy selection
    desc: Farthest-first (Gonzalez) selection and its seeding strategies.
    contents:
      - FarFirst
      - PickPoint
  - title: Max-Min diversity problem solvers
    contents:
      - DropAdd
      - Grasp
      - ExactMaxMin
  - title: Max-Sum diversity problem solver
    contents:
      - ExactMaxSum
  - title: Max-Mean dispersion problem solver
    contents:
      - MaxMean
  - title: k-centre solvers
    contents:
      - KCentre
      - ExactKCentre
  - title: Maximum-entropy (maxdet) selection
    contents:
      - MaxEntropy
  - title: Scoring
    contents:
      - MinDist
      - MeanDist
      - KCentreRadius
  - title: Reporting
    contents:
      - has_concept("reporting functions")
